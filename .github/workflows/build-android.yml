name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt

      - name: Bundle the 51-book catalog into the APK
        run: node scripts/embed-library-catalog.mjs

      - name: Build APK
        working-directory: android
        run: /opt/gradle-8.9/bin/gradle -Pandroid.builder.sdkDownload=true :app:assembleDebug --no-daemon

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/rafeeq-student.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafeeq-student-apk
          path: release/rafeeq-student.apk
          if-no-files-found: error

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Rafeeq Student APK ${{ github.run_number }}"
          generate_release_notes: true
          files: release/rafeeq-student.apk
