name: Build Rafeeq Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/apps/admin/**'
      - 'mobile/packages/**'
      - 'mobile/pnpm-lock.yaml'
      - '.github/workflows/admin-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rafeeq/admin typecheck
      - run: pnpm --filter @rafeeq/admin lint
      - run: pnpm --filter @rafeeq/admin exec jest --config jest.config.cjs --runInBand
      - run: pnpm --filter @rafeeq/admin exec expo prebuild --platform android --no-install
      - run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: mobile/apps/admin/android
      - uses: actions/upload-artifact@v4
        with:
          name: rafeeq-admin-apk
          path: mobile/apps/admin/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
